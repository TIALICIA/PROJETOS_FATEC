name: CI - Implementação do CI (4º Semestre)

# 1. Gatilho PR
on:
  pull_request:
    branches: [ main, master ]

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    # Sobe o banco PostgreSQL temporário para os testes de integração
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: access_control_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Aponta para a pasta exata onde estão o package.json e o Dockerfile
    defaults:
      run:
        working-directory: './4_SEMESTRE/Integração_e_Entrega_Continua/Implementação do CI'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm ci

      # 2. Análise estática de código
      - name: Análise Estática (ESLint)
        run: |
          npm install --no-save typescript-eslint
          npm run lint

      # 3. Análise de formatação
      - name: Análise de Formatação (Prettier)
        run: npm run format:check

      # 4. Análise estática de segurança
      - name: Análise Estática de Segurança
        run: npm audit --audit-level=high

      # 5. Build
      - name: Build da Aplicação
        run: npm run build

      # 6. Teste unitário
      - name: Testes Unitários
        run: npm run test:unit

      # 7. Teste de integração (conectado ao banco SQL)
      - name: Testes de Integração
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/access_control_test?schema=public
          JWT_SECRET: segredo_teste_ci
        run: |
          npx prisma migrate deploy
          npm run test:integration

      # 8. Criação de imagem
      - name: Criação da Imagem Docker
        run: docker build -t access-control-api:${{ github.sha }} .
